[project]
name = "noPac"
version = "1.0.0"
description = "SAM THE ADMIN: CVE-2021-42278 + CVE-2021-42287 chain to impersonate Domain Admin from a standard domain user"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "WazeHell" }
]
keywords = ["active-directory", "kerberos", "noPac", "sam-the-admin", "pentest", "redteam"]

dependencies = [
    "impacket==0.9.24",
    "ldap3>=2.9.1",
    "ldapdomaindump>=0.9.4",
    "pyasn1>=0.4.8",
    "setuptools<81",
]

[project.scripts]
noPac = "noPac:main"
noPacScanner = "scanner:main"

[project.urls]
Repository = "https://github.com/WazeHell/sam-the-admin"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["noPac", "noPacScanner"]

[tool.setuptools.packages.find]
include = ["utils*"]
